# SDC machine Prometheus config — scrapes all 30 student capstone
# containers on ports 8001-8030 plus the instructor dry-run on 8099.
#
# Note (Linux hosts): if Prometheus runs in a container, start it with
#   --add-host=host.docker.internal:host-gateway
# so host.docker.internal resolves. Or replace host.docker.internal
# with the bridge gateway IP (commonly 172.17.0.1).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: capstone-students
    static_configs:
      - targets: [host.docker.internal:8001]
        labels: { student_id: "01" }
      - targets: [host.docker.internal:8002]
        labels: { student_id: "02" }
      - targets: [host.docker.internal:8003]
        labels: { student_id: "03" }
      - targets: [host.docker.internal:8004]
        labels: { student_id: "04" }
