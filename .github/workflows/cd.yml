name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# ---------------------------------------------------------------------
# Before filling this in, set up your fork (one-time):
#
# 1. Fork this repo to your own GitHub account.
# 2. In your fork: Settings -> Secrets and variables -> Actions ->
#    Variables -> New repository variable.
#    Name:  STUDENT_ID
#    Value: the two-digit number your instructor assigned (e.g. 07)
#
# Your deployed container will be named capstone-app-<ID> and listen
# on port 80<ID> so up to 50 students can coexist on one SDC machine.
# ---------------------------------------------------------------------

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # TODO (1): run this job on the SDC self-hosted runner.
    # Replace ubuntu-latest with the labels the runner was registered with.
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, sdc-runner]

    steps:
      - name: Verify STUDENT_ID is set
        run: |
          if [ -z "${{ vars.STUDENT_ID }}" ]; then
            echo "::error::STUDENT_ID variable is not set in this fork. See the comment at the top of cd.yml."
            exit 1
          fi
          echo "Deploying as student ${{ vars.STUDENT_ID }}"

      - uses: actions/checkout@v4

      # Docker image names must be lowercase, but GITHUB_REPOSITORY keeps the
      # original casing (e.g. Ocean1029/...). This step exports a lowercased
      # IMAGE env var that the TODO steps below should reference.
      - name: Resolve lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      # TODO (2): log in to GHCR so `docker pull` works on the runner.
      # Hint: use docker/login-action@v3 with secrets.GITHUB_TOKEN.

      # TODO (3): pull the newest image.
      # Hint: docker pull "$IMAGE"

      # TODO (4): stop and remove the old container if it exists.
      # Hint: docker rm -f capstone-app-${{ vars.STUDENT_ID }} || true

      # TODO (5): run the new container in the background.
      # Port mapping: host 80<ID> -> container 8080, where <ID> = ${{ vars.STUDENT_ID }}.
      # Hint: docker run -d \
      #         --name capstone-app-${{ vars.STUDENT_ID }} \
      #         --restart unless-stopped \
      #         -p 80${{ vars.STUDENT_ID }}:8080 \
      #         "$IMAGE"

      - name: TODOs not filled in yet
        run: |
          echo "::error::Replace this step by filling in the TODO blocks above."
          exit 1
