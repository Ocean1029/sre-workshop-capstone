name: CD

on:
  workflow_call:
  workflow_dispatch:

# ---------------------------------------------------------------------
# Branch-based workshop flow (no fork needed):
#
# 1. Your instructor adds you as a collaborator and assigns you a
#    two-digit STUDENT_ID (e.g. 07).
# 2. Clone the repo and create your own branch:
#      git checkout -b student-<ID>        # e.g. student-07
# 3. Fill in the TODO blocks below, commit, and push your branch.
#      git push -u origin student-<ID>
# 4. CI builds an image tagged :student-<ID>; this workflow then pulls
#    it and runs a container capstone-app-<ID> on port 80<ID> on the
#    SDC machine. 50 students coexist on ports 8001-8050.
#
# STUDENT_ID and IMAGE are derived automatically from the branch name,
# so the TODO steps below only need plain docker commands referencing
# $STUDENT_ID and $IMAGE.
# ---------------------------------------------------------------------

jobs:
  deploy:
    # TODO (1): run this job on the SDC self-hosted runner.
    # Replace ubuntu-latest with the labels the runner was registered with.
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, sdc-runner]

    steps:
      - name: Extract STUDENT_ID and image reference from branch
        run: |
          ID="${GITHUB_REF_NAME#student-}"
          if [ "$ID" = "$GITHUB_REF_NAME" ] || [ -z "$ID" ]; then
            echo "::error::This workflow must run on a branch named student-<ID> (e.g. student-07)."
            exit 1
          fi
          echo "STUDENT_ID=$ID" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Deploying as student $ID"

      - uses: actions/checkout@v4

      # TODO (2): log in to GHCR so `docker pull` works on the runner.
      # Hint: use docker/login-action@v3 with secrets.GITHUB_TOKEN.

      # TODO (3): pull the newest image.
      # Hint: docker pull "$IMAGE"

      # TODO (4): stop and remove the old container if it exists.
      # Hint: docker rm -f capstone-app-$STUDENT_ID || true

      # TODO (5): run the new container in the background.
      # Port mapping: host 80$STUDENT_ID -> container 8080.
      # Hint: docker run -d \
      #         --name capstone-app-$STUDENT_ID \
      #         --restart unless-stopped \
      #         -p 80$STUDENT_ID:8080 \
      #         "$IMAGE"

      - name: TODOs not filled in yet
        run: |
          echo "::error::Replace this step by filling in the TODO blocks above."
          exit 1
