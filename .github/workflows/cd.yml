    # Hint: runs-on: [self-hosted, sdc-runner]
    runs-on: ubuntu-latest

    steps:
      - name: Extract STUDENT_ID and image reference from branch
        run: |
          ID="${GITHUB_REF_NAME#student-}"
          if [ "$ID" = "$GITHUB_REF_NAME" ] || [ -z "$ID" ]; then
            echo "::error::This workflow must run on a branch named student-<ID> (e.g. student-07)."
            exit 1
          fi
          echo "STUDENT_ID=$ID" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Deploying as student $ID"

      - uses: actions/checkout@v4

