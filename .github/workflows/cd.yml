name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------
# DRY-RUN VERSION of the CD workflow.
#
# main branch keeps the skeleton (TODO comments) for students to fill
# in during the capstone. This branch has the finished answer so the
# instructor can validate the full pipeline end-to-end before 4/25.
#
# How to test:
#   1. Push this branch, then: Actions -> CD -> Run workflow ->
#      select `feature/dry-run-cd`. workflow_dispatch honours the
#      workflow file from the chosen branch, so the filled-in job
#      runs without touching main.
#   2. Confirm the self-hosted runner picks the job up, the image
#      pulls, and the container is running.
#   3. curl <sdc-host>:8080/crash a few times.
#   4. Watch Discord for AppCrashing.
# ---------------------------------------------------------------------

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, sdc-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Stop old container
        run: docker rm -f capstone-app || true

      - name: Run new container
        run: |
          docker run -d \
            --name capstone-app \
            --restart unless-stopped \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:latest
