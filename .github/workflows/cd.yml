name: CD

on:
  workflow_call:
  workflow_dispatch:

# ---------------------------------------------------------------------
# STUDENT_ID and IMAGE are derived from the branch name (student-<ID>)
# and exported into $GITHUB_ENV by the first step. The deploy steps
# below pull the freshly-built image and (re)run the per-student
# container on port 80<ID> of the SDC machine.
# ---------------------------------------------------------------------

jobs:
  deploy:
    runs-on: [self-hosted, sdc-runner]

    steps:
      - name: Extract STUDENT_ID and image reference from branch
        run: |
          ID="${GITHUB_REF_NAME#student-}"
          if [ "$ID" = "$GITHUB_REF_NAME" ] || [ -z "$ID" ]; then
            echo "::error::This workflow must run on a branch named student-<ID> (e.g. student-07)."
            exit 1
          fi
          echo "STUDENT_ID=$ID" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Deploying as student $ID"

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the newest image
        run: docker pull "$IMAGE"

      - name: Stop and remove the old container
        run: docker rm -f "capstone-app-$STUDENT_ID" || true

      - name: Run the new container
        run: |
          docker run -d \
            --name "capstone-app-$STUDENT_ID" \
            --restart unless-stopped \
            -p "80$STUDENT_ID:8080" \
            "$IMAGE"
