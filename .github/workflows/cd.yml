name: CD

on:
  workflow_dispatch:

# ---------------------------------------------------------------------
# DRY-RUN VERSION of the CD workflow.
#
# main has a skeleton with TODOs; students fill it in on their own
# student-<ID> branches. This branch has the finished answer so the
# instructor can validate the full pipeline end-to-end.
#
# Hardcoded STUDENT_ID=99, pulls :latest (built from main), deploys
# capstone-app-99 on port 8099.
#
# Trigger: Actions -> CD -> Run workflow -> select feature/dry-run-cd.
# ---------------------------------------------------------------------

jobs:
  deploy:
    runs-on: [self-hosted, sdc-runner]
    steps:
      - name: Set dry-run STUDENT_ID and image reference
        run: |
          echo "STUDENT_ID=99" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull "$IMAGE"

      - name: Stop old container
        run: docker rm -f capstone-app-$STUDENT_ID || true

      - name: Run new container
        run: |
          docker run -d \
            --name capstone-app-$STUDENT_ID \
            --restart unless-stopped \
            -p 80$STUDENT_ID:8080 \
            "$IMAGE"
